<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: center;">Student Registration Form</h1>
    <br><br>
    <label><b>Roll no. :</b></label> &emsp; &emsp; &emsp;
    <input type="text"; size="60">
    <br><br>
    <label><b>Student name :</b></label> &emsp;
    <input type="text"; placeholder="Enter your first name" size="26"> <b>-</b> <input type="text" placeholder="Enter your last name" size="30">
    <br><br>
    <label><b>Father's Name :</b></label> &ensp; 
    <input type="text" size="60">
    <br><br>
    <label><b>Date of Birth :</b></label> &ensp; &ensp;
    <select>
        <option value="" disabled selected>Day</option>
        <option>01</option> <option>02</option> <option>03</option> <option>04</option> <option>05</option> 
        <option>06</option> <option>07</option> <option>08</option> <option>09</option> <option>10</option>
        <option>11</option> <option>12</option> <option>13</option> <option>14</option> <option>15</option> 
        <option>16</option> <option>17</option> <option>18</option> <option>19</option> <option>20</option>
        <option>21</option> <option>22</option> <option>23</option> <option>24</option> <option>25</option> 
        <option>26</option> <option>27</option> <option>28</option> <option>29</option> <option>30</option>
    </select> &nbsp;
    <select>
        <option value="" disabled selected>Month</option>
        <option>JAN</option> <option>FEB</option> <option>MAR</option> <option>APR</option> <option>MAY</option> <option>JUN</option> <option>JUl</option> <option>AUG</option> <option>SEP</option> <option>OCT</option>
        <option>NOV</option> <option>DEC</option>
    </select> &nbsp;
    <select>
        <option value="" disabled selected>Year</option>
        <option>2000</option> <option>2001</option> <option>2002</option> <option>2003</option> <option>2004</option> <option>2005</option>
        <option>2006</option> <option>2007</option> <option>2008</option> <option>2009</option><option>2010</option> <option>2011</option> 
        <option>2012</option> <option>2013</option> <option>2014</option> <option>2015</option> <option>2016</option> <option>2017</option>
        <option>2018</option> <option>2019</option><option>2020</option> <option>2021</option> <option>2022</option> 
        <option>2023</option> <option>2024</option> <option>2025</option> <option>2026</option>
    </select> &nbsp;
    <i><b>(DD-MM-YYYY)</b></i>
    <br><br>
    <label><b>Mobile no. :</b></label> &emsp; &emsp;
    <input type="text" value="+91" size="5">  <b>-</b> <input type="text" size="51">
    <br><br>
    <label><b>Email id : </b></label> &emsp; &emsp; &ensp;
    <input type="text" size="61">
    <br><br>
    <label><b>Password :</b></label> &emsp; &ensp; &ensp; 
    <input type="password" size="61"> 
    <br><br>
    <label><b>Gender :</b></label> &emsp; &emsp; &emsp;
    <input type="radio" name="gender">
    <label><b>Male</b></label> &emsp;
    <input type="radio" name="gender">
    <label><b>Female</b></label>
    <br><br>
    <label><b>Department :</b></label> &emsp;
    <input type="checkbox">
    <label><b>CSE</b></label> &nbsp;
    <input type="checkbox">
    <label><b>IT</b></label> &nbsp;
    <input type="checkbox">
    <label><b>ECE</b></label> &nbsp;
    <input type="checkbox">
    <label><b>Civil</b></label> &nbsp;
    <input type="checkbox">
    <label><b>Mech</b></label>
    <br><br>
    <label><b>Course :</b></label> &emsp; &emsp; &emsp;
    <select style="width: 420px;">
        <option  disabled selected size>-----------------------select current course-----------------------</option>
        <option>B.A</option>
        <option>B.E</option>
        <option>M.B.A</option>
        <option>M.E</option>
        <option>B.TECH</option>
    </select>
    <br><br>
    <label><b>Student photo :</b></label> &ensp;
    <input type="file">
    <br><br>
    <label><b>City :</b></label> &ensp; &emsp; &ensp; &ensp; &emsp;
    <input type="text" size="62">
    <br><br>
    <label><b>ADDRESS :</b></label> &nbsp; &ensp; &nbsp;
    <textarea rows="4" cols="51"></textarea>
    <br><br>
</body>
</html>
